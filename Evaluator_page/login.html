<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentBourse - Log In</title>
  <link rel="stylesheet" href="login-style.css">
</head>
<body>
  <header class="sb-header">
    <div class="sb-logo">
      <span>Student</span><span class="sb-accent">Bourse</span>
    </div>
    <nav class="sb-header-icons">
      <span class="sb-icon">
        <img src="icons/home.svg" alt="Home" class="sb-icon-img">
      </span>
    </nav>
  </header>

  <main class="sb-login-main">
    <div class="sb-login-image">
      <img src="icons/students login.jpg" alt="Students in library">
    </div>
    
    <div class="sb-login-form-container">
      <div class="sb-login-tabs">
        <button class="sb-tab-btn">Create an account</button>
        <button class="sb-tab-btn sb-tab-active">Log in</button>
      </div>

      <p class="sb-login-subtitle">Please sign in to continue smoothly with your application steps.</p>

      <form class="sb-login-form">
        <div class="sb-form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="sb-input" placeholder="Email Address" required>
        </div>

        <div class="sb-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="sb-input" placeholder="atleast 8 characters" required>
        </div>

        <div class="sb-form-submit">
          <button type="submit" class="sb-login-btn">Log In</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
