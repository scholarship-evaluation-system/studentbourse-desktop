<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentBourse - Role Selection</title>
  <link rel="stylesheet" href="role-selection.css">
</head>
<body>
  <header class="sb-header">
    <div class="sb-logo">
      <span>Student</span><span class="sb-accent">Bourse</span>
    </div>
    <nav class="sb-header-icons">
      <span class="sb-icon">
        <img src="../Login page/icons/home.svg" alt="Home" class="sb-icon-img">
      </span>
    </nav>
  </header>

  <main class="sb-role-main">
    <div class="sb-role-image">
      <img src="Choose.jpg" alt="Person working on laptop">
    </div>
    
    <div class="sb-role-container">
      <h1 class="sb-role-title">Role Selection</h1>
      
      <p class="sb-role-description">
        Before we begin, please select your role. The account creation and registration process would follow accordingly.
      </p>
      
      <div class="sb-role-buttons">
        <button class="sb-role-btn sb-student-btn">Student</button>
        <button class="sb-role-btn sb-evaluator-btn">Evaluator</button>
      </div>
    </div>
  </main>
  
  <footer class="sb-footer">
    <a href="#" class="sb-footer-link">+ Terms of use</a>
    <a href="#" class="sb-footer-link">+ Contact Us</a>
  </footer>
</body>
</html>
