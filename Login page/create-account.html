<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentBourse - Create Account</title>
  <link rel="stylesheet" href="create-account.css">
</head>
<body>
  <header class="sb-header">
    <div class="sb-logo">
      <span>Student</span><span class="sb-accent">Bourse</span>
    </div>
    <nav class="sb-header-icons">
      <span class="sb-icon">
        <img src="icons/home.svg" alt="Home" class="sb-icon-img">
      </span>
    </nav>
  </header>

  <main class="sb-login-main">
    <div class="sb-login-image">
      <img src="icons/students login.jpg" alt="Students in library">
    </div>
    
    <div class="sb-login-form-container">
      <div class="sb-login-tabs">
        <button class="sb-tab-btn sb-tab-active">Create an account</button>
        <button class="sb-tab-btn">Log in</button>
      </div>

      <p class="sb-login-subtitle">Begin your application process by creating an account</p>

      <form class="sb-login-form">
        <div class="sb-form-row">
          <div class="sb-form-group">
            <label for="firstName">First Name<span class="sb-required">*</span></label>
            <input type="text" id="firstName" class="sb-input" placeholder="First Name" required>
          </div>
          <div class="sb-form-group">
            <label for="lastName">Last Name<span class="sb-required">*</span></label>
            <input type="text" id="lastName" class="sb-input" placeholder="Last Name" required>
          </div>
        </div>

        <div class="sb-form-row">
          <div class="sb-form-group">
            <label for="email">Email<span class="sb-required">*</span></label>
            <input type="email" id="email" class="sb-input" placeholder="Email Address" required>
          </div>
          <div class="sb-form-group">
            <label for="phone">Phone<span class="sb-required">*</span></label>
            <input type="tel" id="phone" class="sb-input" placeholder="+XX X XX XX XX XX" required>
          </div>
        </div>

        <div class="sb-form-row">
          <div class="sb-form-group">
            <label for="password">Password<span class="sb-required">*</span></label>
            <input type="password" id="password" class="sb-input" placeholder="At Least 8 Characters" required>
          </div>
          <div class="sb-form-group">
            <label for="confirmPassword">Confirm Password<span class="sb-required">*</span></label>
            <input type="password" id="confirmPassword" class="sb-input" placeholder="Retype Password" required>
          </div>
        </div>

        <div class="sb-form-submit">
          <button type="submit" class="sb-register-btn">Register</button>
        </div>
      </form>
    </div>
  </main>
  
  <footer class="sb-footer">
    <a href="#" class="sb-footer-link">+ Terms of use</a>
    <a href="#" class="sb-footer-link">+ Contact Us</a>
  </footer>
</body>
</html>
